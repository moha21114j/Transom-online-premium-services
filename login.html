<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {

            padding: 0;

            width: 100%;
            max-width: 450px;

        }

        .login-btn:active {

        .register-link {

        }

        .register-link p {

        }

            padding-top: 2rem;

        }

        .social-login p {
            text-align: center;
            color: #666;
            margin-bottom: 1rem;
        }

        .social-buttons {
            display: flex;
            gap: 1rem;
        }

        .social-btn {
            flex: 1;
            padding: 12px;

            border-radius: 8px;

            cursor: pointer;

            display: flex;
            align-items: center;

            gap: 0.5rem;
            font-weight: 600;
        }

        .social-btn:hover {
            border-color: #005BAC;

        }

        .error-message {
            background: #ffe6e6;
            color: #d63031;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;

            display: none;
        }

        .success-message {
            background: #e6ffe6;
            color: #00b894;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #00b894;

        }

        @media (max-width: 768px) {
            .main-content {
                padding: 120px 15px 2rem 15px;

            .login-container {

                margin: 1rem;

            .login-header h1 {
                font-size: 1.8rem;
            }

            .social-buttons {
                flex-direction: column;
            }

    </style>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="login-container">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to access your airport services</p>
            </div>

            <!-- Error/Success Messages -->
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <!-- Login Tabs -->
            <div class="login-tabs">
                <button class="tab-button active" onclick="switchTab('email')">Email Login</button>
                <button class="tab-button" onclick="switchTab('phone')">Phone Login</button>
            </div>

            <!-- Email Login Form -->
            <div class="tab-content active" id="email-tab">
                <form id="email-form" onsubmit="handleEmailLogin(event)">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember-email" name="remember">
                            <label for="remember-email">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password" onclick="showForgotPassword()">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Sign In</button>
                </form>
            </div>

            <!-- Phone Login Form -->
            <div class="tab-content" id="phone-tab">
                <form id="phone-form" onsubmit="handlePhoneLogin(event)">
                    <div class="form-group">
                        <label for="phone-number">Phone Number</label>
                        <div class="phone-input">
                            <select id="country-code" name="country-code">
                                <option value="+968">🇴🇲 +968</option>
                                <option value="+971">🇦🇪 +971</option>
                                <option value="+973">🇧🇭 +973</option>
                                <option value="+974">🇶🇦 +974</option>
                                <option value="+965">🇰🇼 +965</option>
                                <option value="+966">🇸🇦 +966</option>
                            </select>
                            <input type="tel" id="phone-number" name="phone" required placeholder="Phone number">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone-password">Password</label>
                        <input type="password" id="phone-password" name="password" required placeholder="Enter your password">
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember-phone" name="remember">
                            <label for="remember-phone">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password" onclick="showForgotPassword()">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Sign In</button>
                </form>
            </div>



            <!-- Register Link -->
            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="register.html">Create Account</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script>
        // Tab switching functionality
        function switchTab(tabType) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabType + '-tab').classList.add('active');
        }

        // Email login handler
        function handleEmailLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember-email').checked;

            // Basic validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Show loading state
            const submitBtn = event.target.querySelector('.login-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Signing In...';
            submitBtn.disabled = true;

            // Simulate login process (replace with actual authentication)
            setTimeout(() => {
                // Demo credentials
                if (email === 'admin@transom.om' && password === 'admin123') {
                    showSuccess('Login successful! Redirecting...');
                    
                    // Save login state
                    if (remember) {
                        localStorage.setItem('rememberedEmail', email);
                    }
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', email);
                    
                    // Redirect after success
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showError('Invalid email or password');
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            }, 1500);
        }

        // Phone login handler
        function handlePhoneLogin(event) {
            event.preventDefault();
            
            const countryCode = document.getElementById('country-code').value;
            const phone = document.getElementById('phone-number').value;
            const password = document.getElementById('phone-password').value;
            const remember = document.getElementById('remember-phone').checked;

            // Basic validation
            if (!phone || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Show loading state
            const submitBtn = event.target.querySelector('.login-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Signing In...';
            submitBtn.disabled = true;

            // Simulate login process
            setTimeout(() => {
                // Demo credentials
                if (phone === '99887766' && password === 'admin123') {
                    showSuccess('Login successful! Redirecting...');
                    
                    // Save login state
                    if (remember) {
                        localStorage.setItem('rememberedPhone', countryCode + phone);
                    }
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userPhone', countryCode + phone);
                    
                    // Redirect after success
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showError('Invalid phone number or password');
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            }, 1500);
        }

        // Social login handler
        function socialLogin(provider) {
            showError(`${provider} login is not yet implemented`);
        }

        // Forgot password handler
        function showForgotPassword() {
            alert('Forgot password functionality would be implemented here.\n\nFor demo purposes:\nEmail: admin@transom.om\nPhone: 99887766\nPassword: admin123');
        }

        // Message display functions
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            successDiv.style.display = 'none';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            errorDiv.style.display = 'none';
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        // Load header and footer
        document.addEventListener('DOMContentLoaded', () => {
            fetch('header.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('header-placeholder').innerHTML = html;
                    const script = document.createElement('script');
                    script.src = 'header.js';
                    document.body.appendChild(script);
                    
                    setTimeout(() => {
                        const savedCurrency = localStorage.getItem('selectedCurrency');
                        if (savedCurrency && window.setCurrency) {
                            const selectedCurrencyTop = document.getElementById('selected-currency');
                            const selectedCurrencyNav = document.getElementById('selected-currency-nav');
                            
                            if (selectedCurrencyTop) {
                                selectedCurrencyTop.textContent = savedCurrency;
                            }
                            if (selectedCurrencyNav) {
                                selectedCurrencyNav.textContent = savedCurrency;
                            }
                        }
                        
                        // Load cart count
                        const cartCount = localStorage.getItem('cartItemCount') || '0';
                        const cartBadge = document.querySelector('.cart-badge');
                        if (cartBadge) {
                            cartBadge.textContent = cartCount;
                            cartBadge.style.display = parseInt(cartCount) > 0 ? 'flex' : 'none';
                        }
                    }, 200);
                });

            fetch('footer.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                });

            // Load remembered credentials
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            const rememberedPhone = localStorage.getItem('rememberedPhone');
            
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('remember-email').checked = true;
            }
            
            if (rememberedPhone) {
                // Extract country code and phone number
                const phoneMatch = rememberedPhone.match(/^(\+\d+)(.+)$/);
                if (phoneMatch) {
                    document.getElementById('country-code').value = phoneMatch[1];
                    document.getElementById('phone-number').value = phoneMatch[2];
                    document.getElementById('remember-phone').checked = true;
                }
            }

            // Check if already logged in
            if (localStorage.getItem('isLoggedIn') === 'true') {
                showSuccess('You are already logged in. Redirecting...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        });
    </script>
</body>
</html>
